[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chatlas"
version = "1.4.1"
description = "ChATlas - retina connectome explorer: ChAT-band stratification, synapse partners and cell-type mosaics (CAVE / Neuroglancer datasets)"
requires-python = ">=3.10"
readme = "README.md"

[project.gui-scripts]
chatlas = "chatlas.app:main"

[tool.setuptools.packages.find]
include = ["chatlas*"]

[tool.setuptools.package-data]
chatlas = ["assets/*"]
