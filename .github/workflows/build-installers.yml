# Builds self-contained ChATlas installers on GitHub's machines and attaches them to a release.
#   Windows .exe (x86_64), macOS .pkg (Apple silicon) and macOS .pkg (Intel).
# Trigger: push a version tag, e.g.  git tag v1.5.1 && git push origin v1.5.1
# (the tag must match __version__ in chatlas/__init__.py). Can also be run by hand from the Actions tab
# (then the installers are only kept as workflow artifacts, no release is made).
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # creates the (empty) release first; each build job uploads its installer to it directly,
    # so no large workflow artifacts are stored (private repos have only 500 MB of artifact storage)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "ChATlas ${TAG#v}" --notes-file .github/release_notes.md --generate-notes

  build:
    name: ${{ matrix.label }}
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x86_64
          - os: macos-15            # Apple silicon (arm64)
            label: macOS Apple silicon
          - os: macos-15-intel      # Intel (x86_64)
            label: macOS Intel
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: build
          python-version: "3.11"
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            APP=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('chatlas/__init__.py').read()).group(1))")
            if [[ "$V" != "$APP" ]]; then echo "::error::tag v$V does not match chatlas/__init__.py ($APP)"; exit 1; fi
          else
            V=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('chatlas/__init__.py').read()).group(1))")
          fi
          echo "CHATLAS_VERSION=$V" >> "$GITHUB_ENV"
          echo "Building ChATlas $V"

      - name: Install constructor
        run: conda install -y -n build constructor

      - name: Probe environment (same packages as the installer)
        run: |
          python installer/build_wheelhouse.py specs > specs.txt
          cat specs.txt
          conda create -y -n probe --file specs.txt

      - name: Bundle the pip-only packages (and ChATlas) as wheels
        run: conda run -n probe python installer/build_wheelhouse.py wheels . installer/wheelhouse.zip

      - name: Build installer
        run: constructor installer --output-dir dist

      - name: Smoke test on Windows (silent install, then import ChATlas)
        if: runner.os == 'Windows'
        continue-on-error: true          # informative only; never blocks the release
        timeout-minutes: 20
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          $dest = Join-Path $env:RUNNER_TEMP "chatlas_test"
          $p = Start-Process -FilePath $exe -ArgumentList "/InstallationType=JustMe", "/RegisterPython=0", "/S", "/D=$dest" -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          & "$dest\python.exe" -c "import chatlas, caveclient, cloudvolume, pyvistaqt; print('installed ok', chatlas.__version__)"

      - name: Smoke test on macOS (install the pkg, then import ChATlas)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          PKG=$(ls dist/*.pkg)
          sudo installer -pkg "$PKG" -target /
          ls -la /Applications/ChATlas.app/Contents || true
          PY=$(ls -d /Library/chatlas-app/bin/python ~/Library/chatlas-app/bin/python 2>/dev/null | head -1)
          echo "installed python: $PY"
          "$PY" -c "import chatlas, caveclient, cloudvolume, pyvistaqt; print('installed ok', chatlas.__version__)"

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.pkg)
          gh release upload "${GITHUB_REF#refs/tags/}" "${files[@]}" --clobber

      - name: Keep installer as a short-lived artifact (manual runs only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: chatlas-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.pkg
          retention-days: 1
          if-no-files-found: error
